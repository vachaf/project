# Apache Security LogFormat v2 Example
#
# Document status: example configuration / candidate
# Date: 2026-05-15
# Scope:
#   - Apache HTTP Server used as the web-facing layer
#   - Static file serving, PHP/PHP-FPM/CGI, reverse proxy, WAF-fronted apps
#   - New v2 test servers only
#
# Related design:
#   docs/design/99_apache_security_io_v2_candidate.md
#
# Important:
#   - Do not modify apache_security_io_v1 in place.
#   - This file is for new v2 test servers only.
#   - Keep existing v1 observability baselines as-is.
#   - This format is still a candidate until parser fixtures/tests are added.
#   - Cookie, Authorization, Set-Cookie, request body, and response body are
#     intentionally not logged here.
#   - These logs are evidence metadata only. Do not infer login success, upload
#     success, file exposure, DB impact, browser execution, or compromise.

# -----------------------------------------------------------------------------
# 1. Recommended modules
# -----------------------------------------------------------------------------
#
# sudo a2enmod unique_id
# sudo a2enmod logio
# sudo a2enmod setenvif
# sudo a2enmod headers      # only when propagating X-Request-ID to backends
# sudo a2enmod remoteip     # only with a trusted proxy/LB policy
#
# Validate:
# apache2ctl -M | grep -E 'log_config|unique_id|logio|setenvif|headers|remoteip'
# sudo apache2ctl configtest
# sudo systemctl reload apache2

# -----------------------------------------------------------------------------
# 2. Common ErrorLogFormat
# -----------------------------------------------------------------------------
#
# Use the same error format across vhosts so app_security.log can be correlated
# with app_error.log using request_id and error_link_id.

ErrorLogFormat "[%{uc}t] [error_link_id:%L] [request_id:%{UNIQUE_ID}e] [module_name:%-m] [log_level:%-l] [src_ip:%a peer_ip:%{c}a] message=%M"

# -----------------------------------------------------------------------------
# 3. Privacy-preserving presence flags
# -----------------------------------------------------------------------------
#
# These flags record only presence. They do not log Cookie or Authorization
# values. They must not be interpreted as successful authentication.
#
# Normalization expectation in parser:
#   "1" -> true
#   "-", "", missing -> false

SetEnvIfNoCase Cookie ".+" has_cookie=1
SetEnvIfNoCase Authorization ".+" has_authorization=1

# -----------------------------------------------------------------------------
# 4. apache_security_io_v2
# -----------------------------------------------------------------------------
#
# Purpose:
#   apache_security_io_v1 + normalized request_target + clearer host/IP trust
#   boundary + privacy-preserving Cookie/Auth presence flags.
#
# Important field notes:
#   - request_target="%U%q" is a normalized convenience field.
#     It does not replace raw_request when raw request-target fidelity matters.
#   - req_host is the client-supplied Host header.
#   - client_ip_source is a literal set by the Apache config author.
#   - has_cookie / has_authorization are presence flags only.
#
# Required:
#   sudo a2enmod logio
#
# For direct Apache/client deployments, use:
#   client_ip_source="direct"
#
# For remoteip trusted-proxy deployments, do not edit this schema in place.
# Use apache_security_io_remoteip_v2 below.

<IfModule logio_module>
    LogIOTrackTTFB ON

    LogFormat "log_schema=apache_security_io_v2 \
log_time=%{%Y-%m-%dT%H:%M:%S}t.%{msec_frac}t%{%z}t \
request_id=%{UNIQUE_ID}e error_link_id=%L \
vhost=\"%v\" server_name=\"%V\" server_port=%p local_ip=%A \
client_ip_source=\"direct\" \
src_ip=%a peer_ip=%{c}a \
method=%m raw_request=\"%r\" request_target=\"%U%q\" uri=\"%U\" query_string=\"%q\" protocol=%H \
status_code=%>s original_status_code=%s response_body_bytes=%B \
in_bytes=%I out_bytes=%O total_bytes=%S \
duration_us=%D ttfb_us=%^FB keepalive_count=%k connection_status=%X handler=\"%R\" \
req_content_type=\"%{Content-Type}i\" req_content_length=\"%{Content-Length}i\" \
resp_content_type=\"%{Content-Type}o\" location=\"%{Location}o\" \
referer=\"%{Referer}i\" origin=\"%{Origin}i\" user_agent=\"%{User-Agent}i\" \
req_host=\"%{Host}i\" \
x_forwarded_for=\"%{X-Forwarded-For}i\" x_real_ip=\"%{X-Real-IP}i\" forwarded=\"%{Forwarded}i\" \
has_cookie=\"%{has_cookie}e\" has_authorization=\"%{has_authorization}e\"" apache_security_io_v2
</IfModule>

# -----------------------------------------------------------------------------
# 5. apache_security_io_remoteip_v2
# -----------------------------------------------------------------------------
#
# Optional schema for Apache behind a trusted proxy or load balancer.
# Use this only when mod_remoteip is configured with a real trusted proxy policy.
#
# Do not enable broad/untrusted proxy ranges.
# x_forwarded_for, x_real_ip, and forwarded remain client/header observations,
# not proof of attacker identity.
#
# Example remoteip policy. Adjust for your network before enabling.
#
# <IfModule remoteip_module>
#     RemoteIPHeader X-Forwarded-For
#     RemoteIPTrustedProxy 192.168.56.1
#     # RemoteIPTrustedProxy 10.0.0.0/8
# </IfModule>

<IfModule logio_module>
    LogFormat "log_schema=apache_security_io_remoteip_v2 \
log_time=%{%Y-%m-%dT%H:%M:%S}t.%{msec_frac}t%{%z}t \
request_id=%{UNIQUE_ID}e error_link_id=%L \
vhost=\"%v\" server_name=\"%V\" server_port=%p local_ip=%A \
client_ip_source=\"remoteip_trusted_proxy\" \
src_ip=%a peer_ip=%{c}a remoteip_proxy_chain=\"%{remoteip-proxy-ip-list}n\" \
method=%m raw_request=\"%r\" request_target=\"%U%q\" uri=\"%U\" query_string=\"%q\" protocol=%H \
status_code=%>s original_status_code=%s response_body_bytes=%B \
in_bytes=%I out_bytes=%O total_bytes=%S \
duration_us=%D ttfb_us=%^FB keepalive_count=%k connection_status=%X handler=\"%R\" \
req_content_type=\"%{Content-Type}i\" req_content_length=\"%{Content-Length}i\" \
resp_content_type=\"%{Content-Type}o\" location=\"%{Location}o\" \
referer=\"%{Referer}i\" origin=\"%{Origin}i\" user_agent=\"%{User-Agent}i\" \
req_host=\"%{Host}i\" \
x_forwarded_for=\"%{X-Forwarded-For}i\" x_real_ip=\"%{X-Real-IP}i\" forwarded=\"%{Forwarded}i\" \
has_cookie=\"%{has_cookie}e\" has_authorization=\"%{has_authorization}e\"" apache_security_io_remoteip_v2
</IfModule>

# -----------------------------------------------------------------------------
# 6. Example VirtualHost: static / PHP app using v2
# -----------------------------------------------------------------------------
#
# Use this shape for new v2 test servers only. Existing v1 servers should remain
# unchanged.

# <VirtualHost *:80>
#     ServerName apache-v2-test.local
#     ServerAdmin admin@example.com
#     DocumentRoot /var/www/apache-v2-test/public
#
#     <Directory /var/www/apache-v2-test/public>
#         Options FollowSymLinks
#         AllowOverride All
#         Require all granted
#     </Directory>
#
#     ErrorLog ${APACHE_LOG_DIR}/apache-v2-test_error.log
#     CustomLog ${APACHE_LOG_DIR}/apache-v2-test_security.log apache_security_io_v2
#     CustomLog ${APACHE_LOG_DIR}/apache-v2-test_access.log combined
# </VirtualHost>

# -----------------------------------------------------------------------------
# 7. Example VirtualHost: reverse proxy app using v2
# -----------------------------------------------------------------------------

# <VirtualHost *:80>
#     ServerName backend-v2-test.local
#     ServerAdmin admin@example.com
#
#     ProxyRequests Off
#     ProxyPass        / http://127.0.0.1:3000/
#     ProxyPassReverse / http://127.0.0.1:3000/
#
#     # Optional. Requires mod_headers. Verify backend logging before relying on it.
#     RequestHeader set X-Request-ID "%{UNIQUE_ID}e" env=UNIQUE_ID
#
#     ErrorLog ${APACHE_LOG_DIR}/backend-v2-test_error.log
#     CustomLog ${APACHE_LOG_DIR}/backend-v2-test_security.log apache_security_io_v2
#     CustomLog ${APACHE_LOG_DIR}/backend-v2-test_access.log combined
# </VirtualHost>

# -----------------------------------------------------------------------------
# 8. Example VirtualHost: remoteip trusted-proxy app using remoteip v2
# -----------------------------------------------------------------------------
#
# Use only after configuring RemoteIPHeader and RemoteIPTrustedProxy safely.

# <VirtualHost *:80>
#     ServerName remoteip-v2-test.local
#     ServerAdmin admin@example.com
#     DocumentRoot /var/www/remoteip-v2-test/public
#
#     <Directory /var/www/remoteip-v2-test/public>
#         Options FollowSymLinks
#         AllowOverride All
#         Require all granted
#     </Directory>
#
#     ErrorLog ${APACHE_LOG_DIR}/remoteip-v2-test_error.log
#     CustomLog ${APACHE_LOG_DIR}/remoteip-v2-test_security.log apache_security_io_remoteip_v2
#     CustomLog ${APACHE_LOG_DIR}/remoteip-v2-test_access.log combined
# </VirtualHost>

# -----------------------------------------------------------------------------
# 9. Validation checklist
# -----------------------------------------------------------------------------
#
# Syntax:
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
#
# Generate sample request:
#   curl -i -H 'User-Agent: logformat-v2-check/1.0' \
#     'http://apache-v2-test.local/search.php?q=test&scenario=logformat_v2_check'
#
# Inspect logs:
#   sudo tail -n 5 /var/log/apache2/*_security.log
#   sudo tail -n 5 /var/log/apache2/*_error.log
#
# Required checks:
#   - log_schema is apache_security_io_v2 or apache_security_io_remoteip_v2.
#   - request_target exists and equals normalized %U%q convenience target.
#   - raw_request remains present and is not replaced by request_target.
#   - req_host exists and is treated as client-controlled request Host header.
#   - client_ip_source exists.
#   - has_cookie / has_authorization are present as quoted presence flags.
#   - Cookie, Authorization, Set-Cookie, request body, and response body are not logged.
#   - status_code=200 is not interpreted as exploit success.
#
# Parser migration note:
#   Add fixtures/tests before treating v2 as a pipeline-supported production input.
