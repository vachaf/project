# Apache Security LogFormat v1 Example
#
# Document status: example configuration
# Date: 2026-05-14
# Scope:
#   - Apache HTTP Server used as the web-facing layer
#   - Static file serving, PHP/PHP-FPM/CGI, reverse proxy, WAF-fronted apps
#
# Related contract:
#   docs/operations/99_apache_custom_log_format_contract.md
#
# Notes:
#   - This file is an example. Review before applying to production.
#   - Reuse the same LogFormat across Apache-fronted apps.
#   - App-specific data belongs in app runtime logs, not app_security.log.
#   - Cookie, Authorization, Set-Cookie, request body, and response body are
#     intentionally not logged here.

# -----------------------------------------------------------------------------
# 1. Recommended modules
# -----------------------------------------------------------------------------
#
# sudo a2enmod unique_id
# sudo a2enmod logio
# sudo a2enmod headers      # only when propagating X-Request-ID to backends
# sudo a2enmod remoteip     # only with a trusted proxy/LB policy
#
# Validate:
# apache2ctl -M | grep -E 'log_config|unique_id|logio|headers|remoteip'
# sudo apache2ctl configtest
# sudo systemctl reload apache2

# -----------------------------------------------------------------------------
# 2. Common ErrorLogFormat
# -----------------------------------------------------------------------------

ErrorLogFormat "[%{uc}t] [error_link_id:%L] [request_id:%{UNIQUE_ID}e] [module_name:%-m] [log_level:%-l] [src_ip:%a peer_ip:%{c}a] message=%M"

# -----------------------------------------------------------------------------
# 3. apache_security_core_v1
# -----------------------------------------------------------------------------
# Minimum common request evidence format.

LogFormat "log_schema=apache_security_core_v1 \
log_time=%{%Y-%m-%dT%H:%M:%S}t.%{msec_frac}t%{%z}t \
request_id=%{UNIQUE_ID}e error_link_id=%L \
vhost=\"%v\" server_name=\"%V\" server_port=%p local_ip=%A \
src_ip=%a peer_ip=%{c}a \
method=%m raw_request=\"%r\" uri=\"%U\" query_string=\"%q\" protocol=%H \
status_code=%>s original_status_code=%s response_body_bytes=%B \
duration_us=%D keepalive_count=%k connection_status=%X handler=\"%R\" \
req_content_type=\"%{Content-Type}i\" req_content_length=\"%{Content-Length}i\" \
resp_content_type=\"%{Content-Type}o\" location=\"%{Location}o\" \
referer=\"%{Referer}i\" origin=\"%{Origin}i\" user_agent=\"%{User-Agent}i\" \
host=\"%{Host}i\" \
x_forwarded_for=\"%{X-Forwarded-For}i\" x_real_ip=\"%{X-Real-IP}i\" forwarded=\"%{Forwarded}i\"" apache_security_core_v1

# -----------------------------------------------------------------------------
# 4. apache_security_io_v1
# -----------------------------------------------------------------------------
# Recommended format for lab/analysis servers.
# Requires mod_logio.

<IfModule logio_module>
    LogIOTrackTTFB ON

    LogFormat "log_schema=apache_security_io_v1 \
log_time=%{%Y-%m-%dT%H:%M:%S}t.%{msec_frac}t%{%z}t \
request_id=%{UNIQUE_ID}e error_link_id=%L \
vhost=\"%v\" server_name=\"%V\" server_port=%p local_ip=%A \
src_ip=%a peer_ip=%{c}a \
method=%m raw_request=\"%r\" uri=\"%U\" query_string=\"%q\" protocol=%H \
status_code=%>s original_status_code=%s response_body_bytes=%B \
in_bytes=%I out_bytes=%O total_bytes=%S \
duration_us=%D ttfb_us=%^FB keepalive_count=%k connection_status=%X handler=\"%R\" \
req_content_type=\"%{Content-Type}i\" req_content_length=\"%{Content-Length}i\" \
resp_content_type=\"%{Content-Type}o\" location=\"%{Location}o\" \
referer=\"%{Referer}i\" origin=\"%{Origin}i\" user_agent=\"%{User-Agent}i\" \
host=\"%{Host}i\" \
x_forwarded_for=\"%{X-Forwarded-For}i\" x_real_ip=\"%{X-Real-IP}i\" forwarded=\"%{Forwarded}i\"" apache_security_io_v1
</IfModule>

# -----------------------------------------------------------------------------
# 5. Optional remoteip policy example
# -----------------------------------------------------------------------------
# Enable only when Apache is behind a trusted proxy or load balancer.
#
# <IfModule remoteip_module>
#     RemoteIPHeader X-Forwarded-For
#     RemoteIPTrustedProxy 192.168.56.1
#     RemoteIPTrustedProxy 10.0.0.0/8
# </IfModule>
#
# If proxy-chain logging is required, define a separate schema version.
# Candidate field:
#   remoteip_proxy_chain=\"%{remoteip-proxy-ip-list}n\"

# -----------------------------------------------------------------------------
# 6. Optional privacy-preserving presence flags
# -----------------------------------------------------------------------------
# Do not log Cookie or Authorization values.
#
# SetEnvIfNoCase Cookie ".+" has_cookie=1
# SetEnvIfNoCase Authorization ".+" has_authorization=1
#
# If added to app_security.log, define a new schema version.

# -----------------------------------------------------------------------------
# 7. Example VirtualHost: static / PHP app
# -----------------------------------------------------------------------------
#
# <VirtualHost *:80>
#     ServerName apache-log-test.local
#     ServerAdmin admin@example.com
#     DocumentRoot /var/www/apache-log-test/public
#
#     <Directory /var/www/apache-log-test/public>
#         Options FollowSymLinks
#         AllowOverride All
#         Require all granted
#     </Directory>
#
#     ErrorLog ${APACHE_LOG_DIR}/apache-log-test_error.log
#     CustomLog ${APACHE_LOG_DIR}/apache-log-test_security.log apache_security_io_v1
#     CustomLog ${APACHE_LOG_DIR}/apache-log-test_access.log combined
# </VirtualHost>

# -----------------------------------------------------------------------------
# 8. Example VirtualHost: reverse proxy app
# -----------------------------------------------------------------------------
#
# <VirtualHost *:80>
#     ServerName backend-app.local
#     ServerAdmin admin@example.com
#
#     ProxyRequests Off
#     ProxyPass        / http://127.0.0.1:3000/
#     ProxyPassReverse / http://127.0.0.1:3000/
#
#     # Optional. Requires mod_headers. Verify backend logging before relying on it.
#     RequestHeader set X-Request-ID "%{UNIQUE_ID}e" env=UNIQUE_ID
#
#     ErrorLog ${APACHE_LOG_DIR}/backend-app_error.log
#     CustomLog ${APACHE_LOG_DIR}/backend-app_security.log apache_security_io_v1
#     CustomLog ${APACHE_LOG_DIR}/backend-app_access.log combined
# </VirtualHost>

# -----------------------------------------------------------------------------
# 9. Example VirtualHost: WAF-fronted app
# -----------------------------------------------------------------------------
# ModSecurity audit logs should remain a separate evidence layer.
#
# <VirtualHost *:80>
#     ServerName waf-app.local
#     ServerAdmin admin@example.com
#     DocumentRoot /var/www/waf-app/public
#
#     <Directory /var/www/waf-app/public>
#         Options FollowSymLinks
#         AllowOverride All
#         Require all granted
#     </Directory>
#
#     ErrorLog ${APACHE_LOG_DIR}/waf-app_error.log
#     CustomLog ${APACHE_LOG_DIR}/waf-app_security.log apache_security_io_v1
# </VirtualHost>

# -----------------------------------------------------------------------------
# 10. Validation checklist
# -----------------------------------------------------------------------------
# sudo apache2ctl configtest
# sudo systemctl reload apache2
# curl -i -H 'User-Agent: logformat-v1-check/1.0' \
#   'http://apache-log-test.local/search.php?q=test&scenario=logformat_check'
# sudo tail -n 5 /var/log/apache2/*security.log
# sudo tail -n 5 /var/log/apache2/*error.log
#
# Required checks:
# - log_schema is the first field.
# - request_id exists or is explicitly '-'.
# - status_code is final status (%>s).
# - raw_request, uri, and query_string are all present.
# - src_ip and peer_ip are both present.
# - Cookie, Authorization, Set-Cookie, request body, and response body are not logged.
