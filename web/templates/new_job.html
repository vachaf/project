<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Analysis Job</title>
    <link rel="stylesheet" href="/static/job-dashboard.css">
</head>
<body class="job-page">
<div class="job-shell">
    <header class="job-topbar">
        <div class="job-brand">
            <span class="job-brand-mark">▣</span>
            <span>Web Log Analysis</span>
        </div>
        <nav class="job-topnav">
            <a href="/">Dashboard</a>
            <a href="/reports">Stage2 Reports</a>
        </nav>
    </header>

    <main class="job-container">
        <div class="job-page-head">
            <div>
                <h1 class="job-page-title">Create New Analysis Job</h1>
                <p class="job-page-subtitle">Request analysis of Apache logs within a KST time range.</p>
            </div>
        </div>

        {% if error %}
        <section class="job-card job-error-card">
            <p>{{ error }}</p>
        </section>
        {% endif %}

        <section class="job-form-card">
            <form method="post" action="/new-job">
                <div class="job-form-section">
                    <div class="job-form-section-title">Time Range</div>
                    <div class="job-form-row">
                        <div class="job-form-group">
                            <label for="time_from">From (KST)</label>
                            <input type="datetime-local" id="time_from" name="time_from" value="{{ time_from_default }}" required>
                        </div>
                        <div class="job-form-group">
                            <label for="time_to">To (KST)</label>
                            <input type="datetime-local" id="time_to" name="time_to" value="{{ time_to_default }}" required>
                        </div>
                    </div>
                </div>

                <div class="job-form-section">
                    <div class="job-form-section-title">Analysis Settings</div>
                    <div class="job-form-row">
                        <div class="job-form-group">
                            <label>Timezone</label>
                            <span class="job-fixed-badge">Asia/Seoul</span>
                        </div>
                        <div class="job-form-group">
                            <label>Mode</label>
                            <span class="job-fixed-badge">full_report</span>
                        </div>
                    </div>
                    <input type="hidden" name="requested_timezone" value="Asia/Seoul">
                    <input type="hidden" name="analysis_mode" value="full_report">
                    <p class="job-muted">최대 분석 범위는 24시간입니다. 저장 시각은 UTC naive DATETIME(3)로 변환됩니다.</p>
                </div>

                <div class="job-btn-row">
                    <a href="/" class="job-btn">Cancel</a>
                    <button type="submit" class="job-btn job-btn-primary">Submit Job</button>
                </div>
            </form>
        </section>
    </main>
</div>
</body>
</html>
