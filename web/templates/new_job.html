<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Analysis Job</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container">
    <header class="page-header">
        <h1>새 full_report 작업 등록</h1>
        <p><a href="/">대시보드로 돌아가기</a></p>
    </header>

    {% if error %}
    <section class="card error-card"><p>{{ error }}</p></section>
    {% endif %}

    <section class="card">
        <form method="post" action="/new-job">
            <div class="form-row">
                <div class="form-group">
                    <label for="time_from">분석 시작(KST)</label>
                    <input type="datetime-local" id="time_from" name="time_from" value="{{ time_from_default }}" required>
                </div>
                <div class="form-group">
                    <label for="time_to">분석 종료(KST)</label>
                    <input type="datetime-local" id="time_to" name="time_to" value="{{ time_to_default }}" required>
                </div>
            </div>
            <input type="hidden" name="requested_timezone" value="Asia/Seoul">
            <input type="hidden" name="analysis_mode" value="full_report">
            <p class="text-muted">requested_timezone은 Asia/Seoul, analysis_mode는 full_report로 고정됩니다. 최대 범위는 24시간입니다.</p>
            <button type="submit" class="btn btn-primary">작업 등록</button>
        </form>
    </section>
</main>
</body>
</html>
