<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Security Intelligence Console{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body class="page {% block body_class %}{% endblock %}">
  {% block app_header %}
  <header class="header">
    <div class="container">
      <h1>Security Intelligence Console</h1>
      <p class="header-subtitle">Stage2 Report Viewer · Quality Lint · Model Comparison</p>
      <nav class="nav">
        <a href="/">Report Viewer</a>
      </nav>
    </div>
  </header>
  {% endblock %}

  <main class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  {% block app_footer %}
  <footer class="container is-muted">
    Phase 1A: Report Viewer | localhost only
  </footer>
  {% endblock %}
</body>
</html>
