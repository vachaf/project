<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Security Intelligence Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/job-dashboard.css">
  <link rel="stylesheet" href="/static/job-ui-additions.css">
  {% block extra_head %}{% endblock %}
  <link rel="stylesheet" href="/static/theme-dark.css">
  <script src="/static/theme-toggle.js"></script>
</head>
<body class="job-page {% block job_body_class %}{% endblock %}">
<div class="job-shell">
  <header class="job-topbar">
    <div class="job-brand">
      <span class="job-brand-mark">▣</span>
      <span>Security Intelligence</span>
      <button type="button" class="theme-toggle job-theme-toggle" onclick="toggleTheme()" aria-label="테마 전환">☾</button>
    </div>
    <nav class="job-topnav" aria-label="analysis job navigation">
      <span class="job-operator-badge">operator</span>
      {% block job_topnav_items %}
      <a href="/">Job Dashboard</a>
      <a href="/new-job">New Job</a>
      <a href="/reports">Legacy Stage2 Reports</a>
      {% endblock %}
    </nav>
  </header>

  <main class="job-container">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
